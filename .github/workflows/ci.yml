name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Syntax check
        run: npm run lint

  mini-app:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mini-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: mini-app/package-lock.json

      - name: Install mini-app dependencies
        run: npm ci

      - name: Build mini-app
        run: npm run build

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t maxbot-backend:ci .

      - name: Build mini-app image
        run: docker build -t maxbot-mini-app:ci ./mini-app
