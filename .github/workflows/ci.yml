name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run all tests
        run: npm test
      - name: Scenario flow tests
        run: npm run test:scenarios
      - name: Lint / syntax
        run: npm run lint
      - name: Repository hygiene
        run: npm run check:repo
      - name: Release audit
        run: npm run release:audit
      - name: Validate Docker build
        run: docker build -t maxobots:ci .
      - name: Validate Docker Compose
        env:
          BOT_TOKEN: ci-placeholder
          MAX_WEBHOOK_SECRET: ci-test-secret
        run: docker compose config
