services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      NODE_ENV: ${NODE_ENV:-development}
      BOT_TRANSPORT: ${BOT_TRANSPORT:-polling}
      PORT: ${PORT:-10000}
      DATA_DIR: ${DATA_DIR:-/app/runtime}
      MAX_WEBHOOK_DOMAIN: ${MAX_WEBHOOK_DOMAIN:-}
      MAX_WEBHOOK_PATH: ${MAX_WEBHOOK_PATH:-/webhook}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_WEBHOOK_PORT: ${MAX_WEBHOOK_PORT:-10000}
      MAX_WEBHOOK_UPDATE_TYPES: ${MAX_WEBHOOK_UPDATE_TYPES:-bot_started,message_created,message_callback}
      MAX_WEBHOOK_START_RETRIES: ${MAX_WEBHOOK_START_RETRIES:-12}
      MAX_WEBHOOK_RETRY_DELAY_MS: ${MAX_WEBHOOK_RETRY_DELAY_MS:-5000}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-7200}
      MAX_ANSWER_LENGTH: ${MAX_ANSWER_LENGTH:-2000}
    volumes:
      - botdata:/app/runtime

volumes:
  botdata:
