openapi: 3.0.3
info:
  title: MAX Social Support Assistant API
  version: 1.0.0
  description: |
    Internal backend API used by the MAX Mini App MVP.
    Authenticated endpoints require the MAX Mini App init data in X-Max-Init-Data.
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /api/meta:
    get:
      summary: Get content metadata
      responses:
        '200':
          description: Metadata for the reasons catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
  /api/scenarios:
    get:
      summary: Список категорий и сценариев
      operationId: getScenarios
      responses:
        '200':
          description: Категории и сценарии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenariosResponse'

  /api/reason/{id}:
    get:
      summary: Get a reason card
      security:
        - MaxInitData: []
      parameters:
        - $ref: '#/components/parameters/ReasonId'
        - $ref: '#/components/parameters/MaxInitData'
      responses:
        '200':
          description: Reason data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reason'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/checklist/{id}:
    get:
      summary: Get a checklist for a reason
      security:
        - MaxInitData: []
      parameters:
        - $ref: '#/components/parameters/ReasonId'
        - $ref: '#/components/parameters/MaxInitData'
      responses:
        '200':
          description: Checklist data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checklist'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    ReasonId:
      name: id
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
      example: income_calc
    MaxInitData:
      name: X-Max-Init-Data
      in: header
      required: true
      schema:
        type: string
      description: Raw MAX WebApp initData value.
  securitySchemes:
    MaxInitData:
      type: apiKey
      in: header
      name: X-Max-Init-Data
  responses:
    Unauthorized:
      description: Missing or invalid MAX init data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidId:
      description: Invalid resource id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Meta:
      type: object
      required: [version, updatedAt, sources]
      properties:
        version:
          type: string
        updatedAt:
          type: string
        sources:
          type: array
          items:
            type: string
  
    ScenariosResponse:
      type: object
      required: [categories, scenarios]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioCategory'
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioSummary'
    ScenarioCategory:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
    ScenarioSummary:
      type: object
      required: [id, categoryId, title, description]
      properties:
        id:
          type: string
        categoryId:
          type: string
        title:
          type: string
        description:
          type: string
        sources:
          type: array
          items:
            type: string

    Reason:
      type: object
      required:
        - id
        - title
        - weight
        - explanation
        - actions
        - documents
        - legalRef
      properties:
        id:
          type: string
        title:
          type: string
        weight:
          type: integer
        keywords:
          type: array
          items:
            type: string
        signals:
          type: object
          additionalProperties:
            type: integer
        explanation:
          type: string
        actions:
          type: array
          items:
            type: string
        documents:
          type: array
          items:
            type: string
        legalRef:
          type: string
        whereToApply:
          type: string
    Checklist:
      type: object
      required:
        - reasonId
        - title
        - steps
        - documents
        - whereToApply
        - legalRef
      properties:
        reasonId:
          type: string
        title:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        whereToApply:
          type: string
        legalRef:
          type: string
    ChecklistItem:
      type: object
      required: [id, text, done]
      properties:
        id:
          type: string
        text:
          type: string
        done:
          type: boolean
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        reason:
          type: string
